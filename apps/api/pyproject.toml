[project]
name = "studyflow-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aiomysql>=0.2.0",
  "asyncmy>=0.2.9",
  "pymysql>=1.1.0",
  "cryptography>=43.0.0",
  "bcrypt>=4.2.0",
  "pwdlib[argon2,bcrypt]>=0.2.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "pyjwt>=2.10.1",
  "python-multipart>=0.0.12",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.34.0",
  "aiosqlite>=0.20.0"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["httpx>=0.28.1", "pytest>=8.3.4", "pytest-asyncio>=0.25.0", "ruff>=0.8.4"]

[tool.ruff]
line-length = 100
target-version = "py311"
