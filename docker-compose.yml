services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-studyflow}
      MYSQL_USER: ${MYSQL_USER:-studyflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-studyflow_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql_setup.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./apps/web
    environment:
      # The browser calls the Next.js origin, which proxies /api/v1 to the api service.
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  mysql_data:
